<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
 html,body{margin:0;background:#000}
 #stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#101820;
   font-family:"Montserrat","Open Sans",sans-serif;color:#fff}
 .L{position:absolute;transform-origin:center center;display:none}
 .t{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:120px}
</style></head>
<body><div id="stage"></div>
<script>
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const ease=x=>1-Math.pow(1-clamp(x,0,1),3);
window.RAW={
  duration:6, width:1920, height:1080, fps:30,
  layers:[
    {id:"bg",name:"Block",type:"shape",x:0,y:760,w:1920,h:320,opacity:1,z:1,start:0,end:6,text:null,src:null},
    {id:"title",name:"Title",type:"text",x:160,y:300,w:1600,h:260,opacity:1,z:5,start:0,end:6,text:"RAW EDIT TEST",src:null},
    {id:"sub",name:"Subtitle",type:"text",x:260,y:600,w:1400,h:120,opacity:1,z:6,start:1,end:6,text:"Simple. Fast. Free.",src:null}
  ],
  anim:{
    bg:t=>({dx:(1-ease(t/0.8))*-1920,dy:0,scale:1,rotate:0,opacity:1}),
    title:t=>({dx:0,dy:(1-ease(t/0.7))*120,scale:0.9+0.1*ease(t/0.7),rotate:0,opacity:ease(t/0.5)}),
    sub:t=>({dx:(1-ease((t-1)/0.6))*200,dy:0,scale:1,rotate:0,opacity:ease((t-1)/0.5)})
  },
  seek(t){
    const stage=document.getElementById("stage");
    for(const l of this.layers){
      let el=document.getElementById("L_"+l.id);
      if(!el){el=document.createElement("div");el.id="L_"+l.id;el.className="L"+(l.type==="text"?" t":"");
        if(l.type==="shape")el.style.background="#ff4d4d";
        if(l.type==="image"){const im=document.createElement("img");im.style.cssText="width:100%;height:100%;object-fit:contain";el.appendChild(im);}
        stage.appendChild(el);}
      if(l.type==="text")el.textContent=l.text||"";
      if(l.type==="image"){const im=el.firstChild;if(im.getAttribute("src")!==l.src)im.setAttribute("src",l.src||"");}
      const vis=t>=l.start&&t<=l.end;
      const a=(this.anim[l.id]?this.anim[l.id](t-l.start):{})||{};
      const dx=a.dx||0,dy=a.dy||0,sc=a.scale==null?1:a.scale,rot=a.rotate||0,op=a.opacity==null?1:a.opacity;
      el.style.display=vis?(l.type==="text"?"flex":"block"):"none";
      el.style.left=l.x+"px";el.style.top=l.y+"px";el.style.width=l.w+"px";el.style.height=l.h+"px";
      el.style.zIndex=l.z;el.style.opacity=clamp(l.opacity*op,0,1);
      el.style.transform=`translate(${dx}px,${dy}px) scale(${sc}) rotate(${rot}deg)`;
    }
  }
};
RAW.seek(0);
</script></body></html>
